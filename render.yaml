services:
  - type: web
    name: winbuzz
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/kabirr6044/winbuzz
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: EXTERNAL_REDIRECT_URL
        sync: false
